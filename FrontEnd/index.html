<!DOCTYPE html>
<html>

<head>
  <title>Contact Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
    

  <div class="fullscreen">
    <div class="card">

      <h1>Contact Manager</h1>

      <!-- Search -->
     <div class="row">
     <input class="search-input" type="text" placeholder="Current Client Name">
     <button class="search-btn">Search</button>
     </div>

     <!-- Add -->
      <div class="row">
        <input class="add-input" type="text" placeholder="Enter new client">
        <button class="add-btn">Add Client</button>
      </div>

      <!-- show -->
       <button class ="show-btn">Show All Clients</button>

    
      <!-- Client List -->
     <div class="client-list"></div>

    
</div>

  <script type="module" src="js/main.js"></script>

</body>

</html>
